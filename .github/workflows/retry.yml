name: Retry failed check

# GitHub's hosted runner pool intermittently fails to assign a runner
# ("The job was not acquired by Runner of type hosted even after multiple
# attempts"). The job never starts, so nothing inside check.yml can retry it.
# This re-runs the failed jobs from the outside, up to 2 extra attempts.

on:
  workflow_run:
    workflows: ["Check Mullvad Exits"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait out the capacity blip
        run: sleep 120

      - name: Re-run failed jobs
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
